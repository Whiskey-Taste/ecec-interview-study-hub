  "questions": [
    {
      "id": 1,
      "q": "Tell me about yourself.",
      "zh": "请介绍一下你自己。",
      "a": "Hi, I'm Tim. I've recently completed my Certificate III in Early Childhood Education and Care, and I'm currently studying towards my Diploma. I completed my placement at Discovery Early Learning Centres in Sorell, where I gained practical experience in both baby and preschool rooms. Before coming to Australia, I worked as a primary school teacher for about two and a half years. I enjoy supporting children's learning and wellbeing, and I'm excited to continue developing my career as an early childhood educator.",
      "cat": 0,
      "priority": true
    },
    {
      "id": 2,
      "q": "Why do you want to work in early childhood education?",
      "zh": "为什么选择幼教行业？",
      "a": "I enjoy working with children and supporting their learning and development. From my previous teaching experience, I understand how important the early years are for building confidence, communication and social skills. I also enjoy the caring side of early childhood education, especially helping children feel safe, supported and included.",
      "cat": 0,
      "priority": true
    },
    {
      "id": 3,
      "q": "Why did you move from primary teaching to early childhood education?",
      "zh": "为什么从小学教学转向幼教？",

      "cat": 0,
      "priority": false
    },
    {
      "id": 4,
      "q": "Why should we hire you?",
      "zh": "我们为什么应该雇用你？",
      "a": "I can bring both previous teaching experience and practical early childhood skills. During my placement, I supported children's daily routines, active supervision and play-based learning. I also developed strong teamwork and communication skills through my teaching career. I'm reliable, patient, willing to learn and committed to children's safety and wellbeing.",
      "cat": 0,
      "priority": true
    },
    {
      "id": 5,
      "q": "What are your strengths?",
      "zh": "你有哪些优势？",
      "a": "My main strengths are patience, communication and staying calm in challenging situations. My teaching background has helped me understand children's different needs, and my placement taught me how important teamwork and flexibility are in a childcare environment.",
      "cat": 0,
      "priority": false
    },
    {
      "id": 6,
      "q": "What is your biggest weakness?",
      "zh": "你最大的不足是什么？",

      "priority": true

      "id": 7,

      "cat": 0,
      "priority": true
    },

      "id": 8,

const LS_KEY = 'little-steps-ecec-v1';

let state=loadData();

function renderFlash(){const session=ui.flashStarted;let q=session?DB.questions.find(x=>x.id===ui.flashList[ui.flashIndex]):null;return `<div class="flash-layout"><div class="eyebrow">ACTIVE RECALL + SPACED REPETITION</div><h1 class="page-title">闪卡记忆训练</h1><p class="subhead">看题 → 自己开口回答 → 翻开答案 → 评价熟练度。系统根据评价安排下次复习日期。</p><div class="flash-shell">${!session?`<div class="panel" style="box-shadow:none;border:0;padding:14px"><h3>选择训练范围</h3><p style="margin-bottom:18px">建议先练高频问题；已练过的题会根据难易程度进入复习队列。</p><div class="filters" style="padding:0;border:0"><select class="select" data-change="flashmode"><option value="all" ${ui.flashMode==='all'?'selected':''}>全部问题</option><option value="priority" ${ui.flashMode==='priority'?'selected':''}>高频重点</option><option value="new" ${ui.flashMode==='new'?'selected':''}>尚未学习</option><option value="due" ${ui.flashMode==='due'?'selected':''}>当前待复习</option><option value="fav" ${ui.flashMode==='fav'?'selected':''}>我的收藏</option></select><select class="select" data-change="flashcat"><option value="all">全部主题</option>${DB.sections.map((c,i)=>`<option value="${i}" ${ui.flashCat===String(i)?'selected':''}>${safeText(c.zh)}</option>`).join('')}</select></div><div class="banner" style="margin:19px 0">当前可练习 <strong>${flashEligible().length}</strong> 道题 · 每次按照随机顺序展示。复习评价只保存在本地。</div>${button('开始本轮练习 →','startflash','')}${flashEligible().length===0?'<p class="smalltext muted" style="margin-top:10px">该筛选暂无题目，请切换范围。</p>':''}</div>`:q?`<div class="row-between" style="margin:0 3px 15px"><div class="mini-gap"><span class="pill">${safeText(catName(q.cat))}</span>${q.priority?'<span class="pill gold">★ 高频</span>':''}</div><span class="circleprogress">${ui.flashIndex+1} / ${ui.flashList.length}</span></div><div class="progress" style="margin-bottom:16px"><span style="width:${ui.flashIndex/ui.flashList.length*100}%"></span></div><div class="flash-card"><div class="eyebrow">QUESTION ${String(q.id).padStart(2,'0')}</div><h2>${safeText(q.q)}</h2><div class="cn">${safeText(q.zh)}</div>${ui.flashRevealed?`<div class="flash-answer">${safeText(q.a)}</div>`:''}</div><div class="flash-footer"><div class="row-between"><div class="mini-gap">${button('🔊 听问题','speak-question','small',`data-id="${q.id}"`)}<button class="chip" data-action="fav" data-id="${q.id}">${state.favorites.includes(q.id)?'★ 已收藏':'☆ 收藏'}</button></div><span class="tiny">${ui.flashRevealed?'你觉得自己回答得如何？':'先尝试回答，不必逐字背诵'}</span></div>${ui.flashRevealed?`<div class="rate-grid"><button class="ratebtn again" data-action="rate" data-grade="1">再来一次<small>10 分钟后</small></button><button class="ratebtn" data-action="rate" data-grade="2">有点难<small>明天</small></button><button class="ratebtn" data-action="rate" data-grade="3">记得不错<small>间隔增加</small></button><button class="ratebtn easy" data-action="rate" data-grade="4">非常熟悉<small>间隔更长</small></button></div>`:`<div class="button-group">${button('显示参考答案','flashreveal','')}${button('跳过本题','flashskip','secondary')}</div>`}</div>`:`<div class="empty"><div style="font-size:45px">🎉</div><h3>这一轮完成了！</h3><p>共复习 ${ui.flashDone} 道题。你可以继续挑战其他题组。</p><div class="button-group" style="justify-content:center;margin-top:18px">${button('再来一轮','restartflash','')}${button('返回概览','nav','secondary','data-page="dashboard"')}</div></div>`}</div><div class="kbdhelp">键盘快捷键：空格 = 翻开答案；1–4 = 评价；Esc = 结束训练</div></div>`}
function renderMock(){let m=ui.mock;if(!m)return `<div class="mock-layout"><div class="eyebrow">REAL-WORLD INTERVIEW PRACTICE</div><h1 class="page-title">模拟面试 🎙️</h1><p class="subhead">随机抽题，限时口头回答，写下自己的思路，与英文范文对照。完成后生成一份简单训练记录。</p><div class="panel"><h3>设置一场模拟面试</h3><p style="margin:7px 0 21px">按照真实招聘场景练习。建议优先从 5 题开始，再增加到 10–15 题。</p><label class="label">题量</label><div class="button-group">${[5,10,15].map(n=>`<button class="chip ${ui.mockN===n?'active':''}" data-action="mockn" data-value="${n}">${n} 题</button>`).join('')}</div><label class="label">岗位 / 主题</label><select class="select" data-change="mockcat"><option value="all">全部主题随机抽取</option>${DB.sections.map((c,i)=>`<option value="${i}" ${ui.mockCat===String(i)?'selected':''}>${safeText(c.zh)}</option>`).join('')}</select><div class="divider"></div>${button('开始模拟面试 →','startmock','')}</div>${state.history.length?`<div class="section-title">最近训练记录</div><div class="panel">${state.history.slice(0,5).map(h=>`<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--border)"><div><strong>${fmtDate(h.date)}</strong><div class="tiny">${h.count} 题 · ${Math.ceil(h.seconds/60)} 分钟</div></div><span class="pill green">平均自评 ${h.avg?Number(h.avg).toFixed(1):'—'}/5</span></div>`).join('')}</div>`:''}</div>`;
let q=DB.questions.find(x=>x.id===m.ids[m.index]);if(m.finished)return `<div class="mock-layout"><div class="eyebrow">SESSION COMPLETE</div><h1 class="page-title">完成模拟面试 🎉</h1><div class="panel"><div style="font-size:52px;text-align:center">🌻</div><h3 style="text-align:center">你完成了 ${m.ids.length} 道题</h3><p style="text-align:center">平均自评：<b>${mockAvg(m).toFixed(1)} / 5</b> · 用时约 ${Math.max(1,Math.ceil(m.seconds/60))} 分钟</p><div class="divider"></div>${m.ids.map((id,i)=>{let x=DB.questions.find(y=>y.id===id);return `<div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span class="smalltext">Q${id}. ${safeText(x.q)}</span><span class="pill">${m.scores[id]||'—'}/5</span></div>`}).join('')}<div class="button-group" style="margin-top:22px">${button('重新开始','newmock','')}${button('复习完整题库','openbank','secondary')}</div></div></div>`;
return `<div class="mock-layout"><div class="eyebrow">LIVE PRACTICE</div><div class="topline"><h1 class="page-title" style="margin:6px 0">模拟面试</h1><span class="timer" id="mock-timer">00:00</span></div><div class="row-between"><span class="muted">第 ${m.index+1} / ${m.ids.length} 题</span><span class="pill green">自我评估模式</span></div><div class="stepper">${m.ids.map((_,i)=>`<span class="${i<m.index?'done':i===m.index?'current':''}"></span>`).join('')}</div><div class="panel"><div class="mini-gap"><span class="pill">${safeText(catName(q.cat))}</span>${q.priority?'<span class="pill gold">★ 高频</span>':''}</div><h2 class="question-large">${safeText(q.q)}</h2><div class="muted">${safeText(q.zh)}</div><div class="button-group" style="margin-top:17px">${button('🔊 朗读问题','speak-question','small',`data-id="${q.id}"`)}${button('查看参考答案','mockanswer','small')}</div><label class="label" for="mock-response">自己的回答要点 / 口语反思</label><textarea id="mock-response" class="textarea" data-mock-response="1" style="min-height:115px" placeholder="建议先开口作答，再记下回答中的关键词、遗漏的步骤以及需要练习的表达...">${safeText(m.responses[q.id]||'')}</textarea>${ui.mockShowAnswer?`<div class="answer answer-text">${safeText(q.a)}</div>`:''}<div class="divider"></div><div class="topline"><b>给这次回答打分</b><span class="tiny">1 = 需要练习，5 = 回答流畅</span></div><div class="rating" style="margin-top:12px">${[1,2,3,4,5].map(n=>`<button class="${m.scores[q.id]===n?'active':''}" data-action="mockrate" data-value="${n}">${n}</button>`).join('')}</div><div class="row-between" style="margin-top:22px">${button('提前结束','stopmock','secondary')}${button(m.index===m.ids.length-1?'完成面试 ✓':'下一道题 →','mocknext','')}</div></div><p class="kbdhelp">计时仅用于练习节奏，不会自动跳题。可以先说再写，也可以只口头回答。</p></div>`}
function renderStar(){let s=DB.stories[ui.story],draft=state.stories[ui.story]||{};return `<div class="eyebrow">SITUATION · TASK · ACTION · RESULT</div><h1 class="page-title">STAR 实战案例库</h1><p class="subhead">把 Discovery Sorell 实习经历整理成真实的行为面试答案。六个主题均有示范草稿，你可以用 STAR 四步法改写。</p><div class="star-layout"><div class="star-nav">${DB.stories.map((x,i)=>`<button class="story-choice ${ui.story===i?'active':''}" data-action="story" data-value="${i}"><b>${i+1}. ${safeText(x.zh)}</b><small>${safeText(x.title)}</small></button>`).join('')}</div><div class="panel"><div class="eyebrow">CASE ${ui.story+1} / ${DB.stories.length}</div><h2 style="margin:6px 0 4px;font-size:22px">${safeText(s.title)}</h2><div class="muted smalltext">${safeText(s.tags)}</div><p style="margin:14px 0;font-weight:700;color:var(--ink)">${safeText(s.q)}</p><div class="banner warn">请保留真实情况：具体行动、是否由 supervisor 指导、结果是否解决，都应与你的 placement 经历一致。不要夸大。</div><div class="button-group" style="margin:17px 0">${button(ui.storySample?'隐藏示例':'显示示例答案','storysample','small')} ${button('复制我的 STAR','copystar','small')}</div>${ui.storySample?`<div class="answer answer-text">${safeText(s.sample)}</div>`:''}<div class="star-forms">${[['S','Situation · 发生了什么？'],['T','Task · 你负责什么？'],['A','Action · 你做了什么？'],['R','Result · 结果与反思？']].map(([k,l])=>`<div><label class="label" for="star-${k}">${l}</label><textarea id="star-${k}" class="textarea" data-story-field="${k}" placeholder="用英文或中文写下真实细节...">${safeText(draft[k]||'')}</textarea></div>`).join('')}</div><p class="tiny" style="margin-top:12px">你的 STAR 草稿会自动保存在当前浏览器。</p></div></div>`}
function renderPlan(){const done=Object.values(state.plan).filter(Boolean).length;return `<div class="eyebrow">FOUR-WEEK TRAINING ROUTINE</div><h1 class="page-title">四周复习计划</h1><p class="subhead">每天约 15–30 分钟。先掌握高频安全问题，再补充教育实践与行为案例，最后针对岗位完成模拟面试。</p><div class="panel" style="margin-bottom:18px"><div class="topline"><h3>计划完成度</h3><strong>${done} / 16</strong></div><div class="progress" style="margin-top:12px"><span style="width:${done/16*100}%"></span></div></div>${DB.plans.map((w,i)=>`<div class="plan-week"><div class="row-between"><h3 style="margin:0">${safeText(w.name)}</h3><span class="pill">${w.tasks.filter((_,j)=>state.plan[`${i}-${j}`]).length} / 4</span></div>${w.tasks.map((task,j)=>{let k=`${i}-${j}`;return `<label class="task ${state.plan[k]?'done':''}"><input type="checkbox" data-plan="${k}" ${state.plan[k]?'checked':''}><span>${safeText(task)}</span></label>`}).join('')}</div>`).join('')}<div class="banner">💡 在每次模拟面试后，记下 2–3 个待改进点，再回到题库对相应问题做记忆训练。</div>`}
function renderSettings(){let s=stats();return `<div class="eyebrow">PRIVACY & BACKUPS</div><h1 class="page-title">数据与设置</h1><p class="subhead">这是一份完整离线网页，没有服务器、账号或上传服务。学习进度默认保存在当前浏览器的本地存储中。</p><div class="grid-two"><div class="panel"><h3>学习数据备份</h3><p style="margin:8px 0 19px">定期导出 JSON 备份。换电脑、换浏览器、移动/重命名 HTML 文件或清理浏览器数据，都可能导致本地记录无法访问。</p><div class="button-group">${button('↓ 导出进度备份','export','')}${button('↑ 导入备份','import','secondary')}</div><div class="divider"></div><h3>已保存内容</h3><p>已接触 ${s.seen} 道 · 掌握 ${s.mastered} 道 · 收藏 ${s.fav} 道 · 模拟面试 ${state.history.length} 场</p></div><div class="panel"><h3>使用说明</h3><p style="margin:9px 0 16px">• 下载后双击 HTML 即可在浏览器使用。<br>• 不依赖网络、第三方脚本或在线字体。<br>• 英语朗读使用浏览器内建语音功能；可用性取决于设备上安装的语音。<br>• 答案可根据你真实经历自行修改或做笔记。</p><div class="banner warn">儿童安全报告、急救与法规内容用于面试复习，不替代当前塔州法规、官方指引、中心政策或正式培训。</div></div></div><div class="panel" style="margin-top:20px"><h3>清除学习数据</h3><p style="margin:7px 0 17px">会清除收藏、复习记录、笔记、STAR 草稿及复习计划。此操作不可撤销，请先备份。</p>${button('清除所有学习数据','reset','danger')}</div><div class="section-title">官方学习资源</div><div class="panel"><p>这些链接仅供你联网时核对最新要求；离线使用题库不受影响。</p><div class="button-group" style="margin-top:12px"><a href="https://www.acecqa.gov.au/nqf/national-quality-standard" target="_blank" rel="noopener" class="support-link">ACECQA · NQS ↗</a><a href="https://www.acecqa.gov.au/nqf/national-law-regulations/approved-learning-frameworks" target="_blank" rel="noopener" class="support-link">Approved Learning Frameworks ↗</a><a href="https://www.strongfamiliessafekids.tas.gov.au/" target="_blank" rel="noopener" class="support-link">Strong Families Safe Kids ↗</a></div></div>`}
function shuffle(xs){let a=xs.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nav(p){ui.page=p;ui.mobile=false;ui.query='';document.getElementById('global-search').value='';render();window.scrollTo({top:0,behavior:'smooth'})}
function prepareFlash(mode=null,specific=null){if(mode)ui.flashMode=mode;ui.page='flash';ui.flashStarted=true;ui.flashList=specific?[specific]:shuffle(flashEligible().map(x=>x.id));ui.flashIndex=0;ui.flashDone=0;ui.flashRevealed=false;render();window.scrollTo(0,0)}
function rateCard(grade){let id=ui.flashList[ui.flashIndex];if(!id)return;let r=rec(id),now=Date.now(),interval=0,streak=r.streak||0,status='learning';if(grade===1){interval=1/144;streak=0}else if(grade===2){interval=1;streak=Math.max(0,streak-1)}else if(grade===3){interval=Math.max(1,Math.round((r.interval||1)*2));streak++}else{interval=Math.max(4,Math.round((r.interval||1)*2.6));streak+=2}if(streak>=3)status='mastered';updateCard(id,{status,interval,streak,attempts:(r.attempts||0)+1,last:now,due:now+interval*ONE_DAY,seen:true});ui.flashIndex++;ui.flashDone++;ui.flashRevealed=false;render()}
function updateTimer(){const el=document.getElementById('mock-timer');if(el&&ui.mock&&!ui.mock.finished){let elapsed=Math.floor((Date.now()-ui.mock.startedAt)/1000);el.textContent=`${String(Math.floor(elapsed/60)).padStart(2,'0')}:${String(elapsed%60).padStart(2,'0')}`}}
setInterval(updateTimer,1000);
function mockAvg(m){let v=Object.values(m.scores).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function finishMock(){let m=ui.mock;if(!m||m.finished)return;m.seconds=Math.round((Date.now()-m.startedAt)/1000);m.finished=true;state.history.unshift({date:Date.now(),count:m.ids.length,seconds:m.seconds,avg:mockAvg(m)});state.history=state.history.slice(0,25);save();render()}
function downloadData(){const content=JSON.stringify({product:'Little Steps ECEC Study Hub',version:1,exportedAt:new Date().toISOString(),data:state},null,2);const blob=new Blob([content],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ECEC_study_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份文件已导出')}
function speak(t){if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音朗读');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-AU';u.rate=.9;u.pitch=1;const voices=speechSynthesis.getVoices();let voice=voices.find(v=>v.lang.toLowerCase()==='en-au'&&v.localService)||voices.find(v=>v.lang.toLowerCase()==='en-au')||voices.find(v=>v.lang.startsWith('en')&&v.localService);if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){toast('朗读不可用，请检查浏览器语音设置')}}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}
function fallbackCopy(t){let el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('已复制')}catch(e){toast('复制失败，请手动选择文本')}el.remove()}
function eventClick(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;let id=Number(el.dataset.id),q=DB.questions.find(x=>x.id===id);
if(a==='nav')return nav(el.dataset.page);if(a==='menu'){ui.mobile=!ui.mobile;render();return}if(a==='theme'){state.theme=state.theme==='light'?'dark':'light';save();render();return}if(a==='quickflash')return prepareFlash('priority');if(a==='dueflash')return prepareFlash('due');if(a==='priorityflash')return prepareFlash('priority');if(a==='openbank')return nav('bank');if(a==='open-cat'){ui.bankCat=el.dataset.cat;return nav('bank')}if(a==='bankfav'){ui.bankFav=!ui.bankFav;return render()}if(a==='bankpriority'){ui.bankPriority=!ui.bankPriority;return render()}if(a==='clearbank'){ui.bankCat='all';ui.bankStatus='all';ui.bankFav=false;ui.bankPriority=false;ui.query='';return render()}
if(a==='open-question'){if(e.target.closest('button')&&e.target.closest('button')!==el)return;ui.openId=ui.openId===id?null:id;ui.bankAnswer=false;if(ui.openId!==null)updateCard(id,{seen:true});return render()}
if(a==='fav'){if(state.favorites.includes(id))state.favorites=state.favorites.filter(x=>x!==id);else state.favorites.push(id);save();render();return}
if(a==='toggleanswer'){ui.bankAnswer=!ui.bankAnswer;return render()}if(a==='speak-question'&&q)return speak(q.q);if(a==='speak-answer'&&q)return speak(q.a);if(a==='singleflash')return prepareFlash(null,id);
if(a==='startflash'||a==='restartflash'){return prepareFlash()};if(a==='flashreveal'){ui.flashRevealed=true;let n=ui.flashList[ui.flashIndex];updateCard(n,{seen:true});return render()}if(a==='flashskip'){ui.flashIndex++;ui.flashRevealed=false;return render()}if(a==='rate')return rateCard(Number(el.dataset.grade));
if(a==='mockn'){ui.mockN=Number(el.dataset.value);return render()}if(a==='startmock'){let pool=DB.questions.filter(x=>ui.mockCat==='all'||x.cat===Number(ui.mockCat));let ids=shuffle(pool.map(x=>x.id)).slice(0,ui.mockN);ui.mock={ids,index:0,startedAt:Date.now(),responses:{},scores:{},finished:false};ui.mockShowAnswer=false;return render()}if(a==='mockanswer'){ui.mockShowAnswer=!ui.mockShowAnswer;return render()}if(a==='mockrate'){if(ui.mock){ui.mock.scores[ui.mock.ids[ui.mock.index]]=Number(el.dataset.value);render()}return}if(a==='mocknext'){if(!ui.mock)return;let qid=ui.mock.ids[ui.mock.index];const ta=document.getElementById('mock-response');if(ta)ui.mock.responses[qid]=ta.value;if(ui.mock.index+1>=ui.mock.ids.length)return finishMock();ui.mock.index++;ui.mockShowAnswer=false;return render()}if(a==='stopmock'){if(confirm('确认提前结束当前模拟面试？已答题目会进入训练记录。'))finishMock();return}if(a==='newmock'){ui.mock=null;return render()}
if(a==='story'){ui.story=Number(el.dataset.value);ui.storySample=false;return render()}if(a==='storysample'){ui.storySample=!ui.storySample;return render()}if(a==='copystar'){let x=state.stories[ui.story]||{},s=DB.stories[ui.story];return copyText(`${s.title}\n${s.q}\nS: ${x.S||''}\nT: ${x.T||''}\nA: ${x.A||''}\nR: ${x.R||''}`)}
if(a==='export')return downloadData();if(a==='import'){document.getElementById('import-file').click();return}if(a==='reset'){if(confirm('此操作会永久清空当前浏览器中的全部学习记录、STAR 草稿及笔记。确定继续？')){state=defaultData();save();ui.openId=null;ui.mock=null;ui.flashStarted=false;toast('所有记录已清除');render()}return}}
document.addEventListener('click',eventClick);
document.getElementById('overlay').addEventListener('click',()=>{ui.mobile=false;render()});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.change){let n=el.dataset.change,v=el.value;if(n==='bankcat')ui.bankCat=v;if(n==='bankstatus')ui.bankStatus=v;if(n==='flashmode')ui.flashMode=v;if(n==='flashcat')ui.flashCat=v;if(n==='mockcat')ui.mockCat=v;render();return}if(el.dataset.plan){state.plan[el.dataset.plan]=el.checked;save();render()}});
document.addEventListener('input',e=>{let el=e.target;if(el.id==='global-search'){ui.query=el.value;ui.page='bank';ui.mobile=false;let selStart=el.selectionStart;render();let inp=document.getElementById('global-search');inp.focus();inp.setSelectionRange(selStart,selStart);return}if(el.dataset.note){state.notes[el.dataset.note]=el.value;save();return}if(el.dataset.storyField){let i=ui.story;state.stories[i]=state.stories[i]||{};state.stories[i][el.dataset.storyField]=el.value;save();return}if(el.dataset.mockResponse&&ui.mock){ui.mock.responses[ui.mock.ids[ui.mock.index]]=el.value;return}});
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();let editing=['textarea','input','select'].includes(tag)||e.target.isContentEditable;if(e.key==='/'&&!editing){e.preventDefault();document.getElementById('global-search').focus();return}if(e.key==='Escape'){if(ui.mobile){ui.mobile=false;render();return}if(ui.page==='flash'&&ui.flashStarted){ui.flashStarted=false;render();return}}if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('qhead')&&!e.target.closest('button')){e.preventDefault();e.target.click();return}if(!editing&&ui.page==='flash'&&ui.flashStarted&&ui.flashList[ui.flashIndex]){if(e.code==='Space'&&!ui.flashRevealed){e.preventDefault();ui.flashRevealed=true;updateCard(ui.flashList[ui.flashIndex],{seen:true});render();return}if(ui.flashRevealed&&['1','2','3','4'].includes(e.key)){e.preventDefault();rateCard(Number(e.key));return}}});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{let content=JSON.parse(await f.text()),d=content.data;if(content.product!=='Little Steps ECEC Study Hub'||!d||d.schema!==1||!d.cards||typeof d.cards!=='object'||!Array.isArray(d.favorites)||typeof d.notes!=='object'||typeof d.stories!=='object'||typeof d.plan!=='object'){throw Error('文件格式不匹配')}if(confirm('导入备份将替换当前所有学习数据。确定继续？')){state={...defaultData(),...d};save();ui.flashStarted=false;ui.mock=null;toast('备份导入成功');render()}}catch(err){toast('导入失败：不是有效的学习备份文件')}e.target.value=''});
render();
</script>
</body>
</html>
